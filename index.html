/* ==================== QA CHECKLIST PASS (2026-09-28) ====================
   Later-wins overrides for the FLN QA checklist. Each block names its item. */

/* [07] Veil: #39373799 + 15.8px blur over the WHOLE viewport, uniform. The stage used to get
   its own extra filter:blur(5px) under the veil, so it read blurrier than the letterbox -
   the backdrop blur alone now does all of it, identically everywhere. */
.stage.blurred .stage-inner{filter:none;}
.stage.gating .start-gate{filter:none;}
/* [07] the gate headline, as HI01H01_L02_S04 draws it: 96px, 271px from the top, a 10px white stroke, centred on the
   screen (left 50% + translateX(-50%), above). Review 2026-09-30: "has the size of this text reduced? make it back to
   normal" - the earlier QA scaling, min(96px, 7.4vw, 11vh), shrank it on every ordinary laptop window (77px at 1445x704).
   It now shrinks ONLY where 96px cannot fit: a screen narrower than the longest line (687px at 96px = 7.2 x the size)
   plus 24px each side, or one so short that the text would reach Swiftie (her crest = the gate's height minus her own,
   clamp(300px,44vh,520px)); the top moves up with it so it always stays 16px above her. */
.pg-title{
  --pg-crest:calc(100dvh - clamp(300px,44vh,520px));
  --pg-f:max(32px,min(96px,calc((100vw - 48px) / 7.2),calc(var(--pg-crest) - 40px)));
  font-size:var(--pg-f);top:min(271px,calc(var(--pg-crest) - 16px - var(--pg-f)));
  -webkit-text-stroke:calc(var(--pg-f) * 10 / 96) #FFFFFF;}
/* [peek-5] the headline waits for Swiftie: hidden while she peeks and rises, pops in when app.js adds .talking (her
   first open-mouth frame, the same tick the VO starts), and fades as she ducks. The keyframes carry the
   translateX(-50%) centring so the pop scales about the headline's own centre. Under the reduced-motion kill the
   animation is dropped and the end state stays, so the headline still appears on cue. */
.phase-gate .pg-title{opacity:0;}
.phase-gate.talking .pg-title{opacity:1;animation:pgTitleIn .38s cubic-bezier(.34,1.5,.6,1) both;}
.phase-gate.talking.leaving .pg-title{animation:pgTitleOut .3s ease-in both;}
@keyframes pgTitleIn{from{opacity:0;transform:translateX(-50%) scale(.6);}to{opacity:1;transform:translateX(-50%) scale(1);}}
@keyframes pgTitleOut{to{opacity:0;transform:translateX(-50%) scale(.92);}}

/* [10] WRONG card: the shake never played. A wrong tap carries BOTH .crossed and .wg-wrong, and
   `.opt-cell.crossed{animation:none}` (same specificity, later) beat `.opt-cell.wg-wrong{animation:wgNo}`.
   At (0,3,0) the shake wins; the red border + ~900ms release are unchanged. No cross icon. */
.opt-cell.crossed.wg-wrong{animation:wgNo var(--wgT) ease-in-out both;}
/* [10] CORRECT card: never the tick badge - including the REVEAL path, which added only .correct
   and so showed the old 64px green tick with a thin border. It now gets .ck-correct (app.js). */
.opt-cell.correct::after,.stage .opt-cell.correct::after{content:none !important;display:none !important;}
/* [10] MCQ default card: hover LIFTS (ledge 6px, face up 2px), press SINKS (ledge 2px, face down 2px).
   The earlier hover only thickened the ledge with transform:none, so the card never moved. */
.stage.thm-toybox .opt-cell:hover,.stage .opt-cell:hover{transform:translateY(-2px);box-shadow:0 6px 0 #D9D9D9;}
.stage.thm-toybox .opt-cell:active,.stage .opt-cell:active{transform:translateY(2px);box-shadow:0 2px 0 #D9D9D9;}
/* [10] HEADER: no enlarge/bounce CSS animation - motion comes from the animated image files only.
   .mascot-wrap.react popped the header Swiftie to 1.13x on every mood change; the chip grew on hover. */
.mascot-wrap.react{animation:none !important;}
.audio-chip:hover{transform:none;}   /* [QA 05] gentle wrong-submit shake on the MAKE_SET row */

/* [12] the nudge hand = FLN animation kit recipe 3, treatment C (the plain press, `nhTapNew` in the kit's nudge-press
   block above: contact held 45->62%) + recipe 4, the TAP RIPPLE (review 2026-09-30: "the hand nudge doesn't have the
   correct tapping effect, it has a circular one - use the toolkit's hand nudge with the tapping ripple"). The old
   two-layer clipped hand and its plain white contact ring are gone. */
/* ===== FLN ANIMATION KIT: nudge-ripple BEGIN ===== */
/* Each layer is on a 120-unit square canvas centred on the ripple origin, so
   background-size:contain + transform-origin:50% 50% scales it about the fingertip.
   GEOMETRY: #nudgeHand is 86x108; nudge_hand_new.svg (75x94, viewBox 33 24 75 94)
   renders at object-fit:contain scale 1.1467 -> fingertip at (34.2, 15.8).
   The 94.6px FX square is offset to centre exactly there. The layers sit BEHIND the hand (the span comes first)
   and run the SAME 1.3s as nhTapNew, so the ripple breaks on the frame the finger touches. Assets: the kit's own
   nudge_fx_ring_outer / _inner / _sparks.svg (from MTKGA02_L01_S01, byte-identical), kept flat in assets/. */
#nudgeHand .nh-tapfx{position:absolute;width:94.6px;height:94.6px;
  left:-13.08px;top:-31.48px;pointer-events:none;}
#nudgeHand .nh-tapfx i{position:absolute;inset:0;display:block;
  background-repeat:no-repeat;background-position:center;background-size:contain;
  transform-origin:50% 50%;opacity:0;}
#nudgeHand .nh-tapfx .fx-ro{background-image:url(assets/nudge_fx_ring_outer.svg);
  animation:nhRippleOuter 1.3s ease-out infinite;}
#nudgeHand .nh-tapfx .fx-ri{background-image:url(assets/nudge_fx_ring_inner.svg);
  animation:nhRippleInner 1.3s ease-out infinite;}
#nudgeHand .nh-tapfx .fx-sp{background-image:url(assets/nudge_fx_sparks.svg);
  animation:nhSparkPop 1.3s ease-out infinite;}

/* inner leads, outer trails - one ripple rolling out */
@keyframes nhRippleInner{0%,38%{opacity:0;transform:scale(.30);}47%{opacity:1;transform:scale(.74);}
  70%{opacity:.5;transform:scale(1.10);}90%,100%{opacity:0;transform:scale(1.34);}}
@keyframes nhRippleOuter{0%,45%{opacity:0;transform:scale(.55);}56%{opacity:.95;transform:scale(.88);}
  78%{opacity:.4;transform:scale(1.20);}96%,100%{opacity:0;transform:scale(1.46);}}
@keyframes nhSparkPop{0%,42%{opacity:0;transform:scale(.55);}52%{opacity:1;transform:scale(1);}
  68%{opacity:1;transform:scale(1.06);}86%,100%{opacity:0;transform:scale(1.18);}}
/* ===== FLN ANIMATION KIT: nudge-ripple END ===== */
#nudgeHand img{position:relative;display:block;}   /* over the ripple (the span is absolute and comes first) */
@media (prefers-reduced-motion:reduce){ #nudgeHand img,#nudgeHand .nh-tapfx i{animation:none;} }

/* [03] landing mascot = EXACTLY HI01H01_L02_S04's first screen (review 2026-09-29: "take exactly the
   size from the 1st screen of HI01H01"): 208px wide, left -24, bottom -12, and its VO chip at
   left 96 / bottom -16 on her leg. Supersedes the checklist's ~180px/-3 (which drew her 13% smaller
   than the reference). Same animation as HI01's new_landing_swiftee_anim.webp, but re-encoded 2026-09-29
   ("swifty is getting glitched"): its clip snaps between two poses at frames 1->2 and 29->30. It now STARTS at the
   clip's frame 2 (frames 0-1 were the end pose - the loop's seam - flashing at the start) and the 29->30 snap has 3
   cross-fade frames (60ms): 37 frames, 3.24s, plays once, same last frame. It is drawn by app.js [landing mascot
   player] on a canvas where the browser can (Chrome blanked the <img> for 1-2 frames at frame changes); the <img>
   stays the fallback. Original kept outside the game folder.
   will-change:transform = her own GPU layer. Without it Chrome paints her through the drop-shadow
   filter surface shared with the card FX (dust canvas / flare / lamp) at reduced resampling quality:
   measured 87% of the sharpest Chrome can draw this 560px frame; with it 97%, also after a resize. */
.sg-mascot{width:208px;height:auto;left:-24px;bottom:-12px;animation:none;will-change:transform;}
.sg-vo{left:96px;bottom:-16px;}

/* [04] SPEAKING = white text-stroke outline while that word's VO plays (the tutorial prompt while
   the prompt is spoken, the big running numeral while its number is spoken - app.js toggles
   .speaking). paint-order puts the stroke BEHIND the fill, so it rings the letters instead of
   eating into Devanagari strokes; the soft shadow keeps the ring visible on the white card. */
.tut-prompt.speaking{
  -webkit-text-stroke:8px #FFFFFF;paint-order:stroke fill;
  text-shadow:0 0 14px rgba(25,135,252,.35);transition:text-shadow .15s ease;}
/* [04] tutorial prompt per the checklist type spec: 64px / 800 / min-height 118px / nowrap / navy.
   (Was held at HI01's 52px wrapping, because an EARLIER prompt was a long sentence that could not
   fit one line at 64px. The current three prompts fit on one line - measured in the harness.) */
.tut-prompt{font-size:64px;font-weight:800;min-height:118px;white-space:nowrap;color:#012F76;line-height:1.1;}
/* [09] option / box labels: SemiBold 23.84px / 100% / #012F76. `.makeset-target .ms-label`
   (28px / 800) out-specified the checklist rule for .ms-label, so the spec is restated at its level. */
.opt-cell .lbl{font-size:23.84px;font-weight:600;line-height:1;color:#012F76;}

/* [10] Next / Continue use the REAL default + deactive button ASSETS, not a CSS-only fake state.
   assets/btn-next-{default,deactive}.svg and btn-continue-{default,deactive}.svg carry the face,
   rim and the label (as outlines). The state class only swaps which asset shows. The button keeps
   its text node for screen readers; it is painted transparent.
   NEXT (review 2026-09-30: "remove the word आगे, keep only the arrow in the middle; the 1st screen's
   button style, but this button's wider pill shape"): btn-next-* are the play button's gold / grey
   sets (btn-play-blob*.svg) built on the same 170x62 pill, with the arrow alone, centred. Their
   shadows are the play button's navy-tinted ones (grey while it waits). */
.nav-btn,.stage .nav-btn{width:170px;min-width:170px;height:62px;padding:0;border:0;border-radius:9999px;
  color:transparent;font-size:0;box-shadow:none;filter:drop-shadow(0 4px 4px rgba(70,70,82,.22));}
.nav-btn::after{content:none;}
.nav-btn.active,.stage .nav-btn.active{color:transparent;box-shadow:none;filter:drop-shadow(0 7px 7px rgba(12,46,92,.32)) drop-shadow(0 2px 2px rgba(12,46,92,.18));}
.nav-btn.active:active{box-shadow:none;filter:drop-shadow(0 3px 3px rgba(12,46,92,.28));}

.end-btn:active{box-shadow:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));}
.end-btn:disabled{filter:drop-shadow(0 4px 0 #D6D6D6);cursor:default;}

/* ==================== PLAY BUTTON: WAIT -> POP -> IDLE PULSE (review 2026-09-28) ====================
   Behaviour matches the reference game (HI02H11_L01_S01): grey + disabled while the landing greeting
   speaks, gold + live the moment it ends, and the strong idle pulse after 5s untouched. The swap is
   in app.js (setStartBtnReady); this is the look.
   SHADOW: drop-shadow() on the <img>, so it follows the blob's own outline (a box-shadow would draw
   a rectangle). Navy-tinted like the reference's 0 10px 16px rgba(12,46,92,.30). */
.sg-btn.sg-btn--play img{filter:drop-shadow(0 9px 9px rgba(12,46,92,.34)) drop-shadow(0 2px 2px rgba(12,46,92,.20));}
.sg-btn.sg-btn--play.sg-waiting img{filter:drop-shadow(0 5px 5px rgba(70,70,82,.22));}
.sg-btn.sg-waiting{cursor:default;animation:none;}
.sg-btn.sg-waiting:active{transform:translateX(-50%);}
/* the gold ring that bursts out of the button - behind the art (the button is its own stacking context) */
.sg-btn.sg-btn--play::before{content:"";position:absolute;left:8%;right:8%;top:6%;bottom:10%;border-radius:50%;
  z-index:-1;pointer-events:none;opacity:0;}
/* POP: the one-shot "I'm ready" when the greeting ends */
.sg-btn.sg-btn--play.sg-pop{animation:sgPlayPop .6s cubic-bezier(.34,1.3,.5,1) both;}
.sg-btn.sg-btn--play.sg-pop::before{animation:sgPlayHalo .75s ease-out both;}
@keyframes sgPlayPop{
  0%  {transform:translateX(-50%) scale(1);}
  35% {transform:translateX(-50%) scale(1.20);}
  60% {transform:translateX(-50%) scale(.93);}
  80% {transform:translateX(-50%) scale(1.05);}
  100%{transform:translateX(-50%) scale(1);}
}
/* IDLE PULSE: the reference's sgBtnPulseStrong + sgBtnHalo, verbatim timings */
.sg-btn.sg-btn--play.idle-pulse{animation:sgPlayPulse 1.15s cubic-bezier(.34,.62,.3,1) infinite;}
.sg-btn.sg-btn--play.idle-pulse::before{animation:sgPlayHalo 1.15s ease-out infinite;}
@keyframes sgPlayPulse{
  0%,100%{transform:translateX(-50%) scale(1);}
  30%    {transform:translateX(-50%) scale(1.10);}
  58%    {transform:translateX(-50%) scale(.985);}
}
@keyframes sgPlayHalo{
  0%  {opacity:1;box-shadow:0 0 0 0    rgba(248,190,42,.60);}
  72% {opacity:1;box-shadow:0 0 0 26px rgba(248,190,42,0);}
  100%{opacity:0;box-shadow:0 0 0 0    rgba(248,190,42,0);}
}
@media (prefers-reduced-motion:reduce){
  .sg-btn.sg-btn--play.sg-pop,.sg-btn.sg-btn--play.idle-pulse,
  .sg-btn.sg-btn--play.sg-pop::before,.sg-btn.sg-btn--play.idle-pulse::before{animation:none;}
}

   NEXT  its CSS pill: #FCB717, 3px white rim, 170x62, the bevel + drop shadows, a 52px navy "→" (Baloo 2)
   END   its CSS pill: #FCB717, 4px white rim, 14px 44px padding (~134x88), the same shadows + "→"
   They replace this game's own SVG buttons (btn-play-blob / btn-next / btn-continue-arrow). The waiting / deactive

.sg-btn.sg-btn--art.sg-btn--play{width:140px;bottom:12px;}   /* (bigger than the old 112px blob: 16px lower, so it clears the cube row) */
.sg-btn.sg-btn--play img,.sg-btn.sg-btn--play.sg-waiting img{filter:none;}
.nav-btn,.stage .nav-btn,.nav-btn.active,.stage .nav-btn.active{width:170px;min-width:170px;height:62px;padding:0;

/* ==================== [pv kit] the place-value addition screens (app.js PVK + PVModules) ====================
   One look for both games, in MTG2A04's own tokens: navy #012F76 text, the answer cards' white face / 2.69px #D5D8DF
   rim / 0 4px 0 #D9D9D9 ledge, the gold button (#FCB717, white rim, the bevel), Baloo 2 800. The deck's colours for
   place value: tens green (the rods), ones orange (the cubes) - the table's two heads carry them. */
.tut-card.tc-pv .tut-content{position:relative;}
/* a bigger working area on the pv tutorial card: it grows into the stage's spare top / bottom margin (the slide-stage
   pads 96 / 92) so the sum table clears the card's bottom border - the tables keep their size */
.tut-card.tc-pv{margin:-20px 0 -40px;}
.tut-card.tc-story .tut-prompt{visibility:hidden;}   /* the story pages: no title (user 2026-10-16); its room kept so nothing moves */
/* the first screen's scene is each game's own village art (assets/bg_landing_v3.webp - a new name each time the art changes, so no browser keeps the old one; v3 = S01 wall raised over the sky): shown whole-width and
   cropped top / bottom (not stretched into the 2.5:1 card), and the old room art's lamp glow + lens flare are off */
.sg-card::before{background-image:url("assets/bg_landing_v3.webp") !important;background-size:cover !important;background-position:center 40% !important;}
.sg-fx .sg-lamp,.sg-fx .sg-sun{display:none;}
.pv-stage{position:absolute;width:1333px;height:750px;pointer-events:none;z-index:2;}
.pv-stage > *,.pv-stage > .pv-row > *{position:absolute;pointer-events:auto;}
.pv-hide{opacity:0 !important;pointer-events:none !important;}
.pv-gone{opacity:0 !important;pointer-events:none !important;transition:opacity .45s ease-out !important;}
.pv-pop{animation:pvPop .45s cubic-bezier(.3,1.6,.5,1) both;}
@keyframes pvPop{0%{opacity:0;scale:.55;}100%{opacity:1;scale:1;}}

/* the table */
.pv-table{box-sizing:border-box;background:#fff;border:3px solid #B7DCFB;border-radius:18px;overflow:hidden;pointer-events:none !important;z-index:1;
  box-shadow:0 4px 0 #D5E6F7,0 10px 24px rgba(0,47,118,.10);transition:opacity .35s;}
.pv-th{position:absolute;top:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-bottom:3px solid #B7DCFB;
  font-family:var(--font-hi);font-weight:800;line-height:1;transition:background .25s,color .25s;}
.pv-th-t{left:0;background:#E7F6DC;color:#1E6400;}
.pv-th-o{background:#FFF1D8;color:#9A4300;}
.pv-th.hl{animation:pvHead .9s ease-in-out infinite;}
.pv-th-t.hl{background:#C9EDB0;}
.pv-th-o.hl{background:#FFDDA3;}
@keyframes pvHead{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0);}50%{box-shadow:inset 0 0 0 4px rgba(255,255,255,.9);}}
.pv-div{position:absolute;top:0;bottom:0;width:3px;background:#B7DCFB;}

/* the blocks */
.pv-blk{box-sizing:content-box;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;z-index:5;
  filter:drop-shadow(0 2px 2px rgba(12,46,92,.28));transition:opacity .3s;}
.pv-blk.pv-tap{cursor:pointer;}
.pv-cube.pv-tap{padding:5px;margin:-5px;}                      /* a bigger touch area than the cube itself */
.pv-rod.pv-tap,.pv-rod.pv-grab{padding:4px 9px;margin:-4px -9px;cursor:pointer;}
.pv-rod.pv-grab{touch-action:none;cursor:grab;}
.pv-blk.lift{scale:1.08;cursor:grabbing;filter:drop-shadow(0 8px 10px rgba(12,46,92,.35));}
.pv-blk.pulse{animation:pvBlkPulse 1.1s ease-in-out infinite;}
/* review 2026-10-14: "rather than this glow effect, an inner light blink" - no halo round the block any more: the light is
   INSIDE it (the block itself brightens and dims), its own soft shadow kept */
@keyframes pvBlkPulse{0%,100%{scale:1;filter:brightness(1) drop-shadow(0 2px 2px rgba(12,46,92,.28));}
  50%{scale:1.1;filter:brightness(1.22) saturate(1.06) drop-shadow(0 2px 2px rgba(12,46,92,.28));}}
/* the "look at these" light (user 2026-10-16): an inner glow only (pv_core.js #pvInGlow - a soft white light in the middle
   of the block, pulsing in and out), the same on the green rods and the yellow cubes; no brightening, no outer halo -
   and a small grow with it */
.pv-blk.hl{filter:url(#pvInGlow) drop-shadow(0 2px 2px rgba(12,46,92,.28));animation:pvBlkHl 1.1s ease-in-out 2;}

.pv-ghost{z-index:4;opacity:.28;filter:grayscale(1);pointer-events:none !important;}
.pv-ghostdrag{z-index:29;opacity:.55;pointer-events:none !important;}
.pv-new{animation:pvInnerBlink 1.1s ease-in-out 2;}   /* a new ten: its light blinks twice inside it as it forms, then rests (review 2026-10-14) */
@keyframes pvInnerBlink{0%,100%{filter:brightness(1) drop-shadow(0 2px 2px rgba(12,46,92,.28));}
  50%{filter:brightness(1.22) saturate(1.06) drop-shadow(0 2px 2px rgba(12,46,92,.28));}}
.pv-blk.moving{z-index:30;}

/* numbers and the equation */
.pv-num{display:flex;align-items:center;justify-content:center;box-sizing:border-box;transform:translateX(-50%);padding:0 14px;
  background:#fff;border:2.69px solid #D5D8DF;box-shadow:0 4px 0 #D9D9D9;font-family:var(--font-hi);font-weight:800;line-height:1;color:#012F76;z-index:6;}

.pv-d.hl-t{color:#2E7D0F;scale:1.25;text-shadow:0 0 10px rgba(110,200,40,.65);}
.pv-d.hl-o{color:#E07800;scale:1.25;text-shadow:0 0 10px rgba(255,160,0,.65);}

.pv-q.filled{border:5px solid #00B132;border-style:solid;background:#EFFBF2;color:#012F76;box-shadow:0 4px 0 #A8E3B9,0 0 6px #00B132;}
.pv-eq{display:flex;align-items:center;gap:16px;transform:translateX(-50%);transform-origin:50% 0;z-index:6;transition:scale .5s;}

.pv-op{font-family:var(--font-hi);font-weight:800;line-height:1;color:#012F76;}
.pv-sym{transform:translateX(-50%);pointer-events:none !important;}
.pv-total{z-index:7;}
.pv-fly{z-index:60;pointer-events:none !important;}
.pv-dig{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);

/* the + buttons, the दहाई बनाओ button, the ten's ring and target place */
.pv-src{display:flex;align-items:center;gap:10px;height:64px;padding:0 10px 0 18px;box-sizing:border-box;transform:translateX(-50%);
  border-radius:20px;background:#fff;border:3px solid #B7DCFB;box-shadow:0 4px 0 #CFE3F7;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:8;transition:opacity .25s,filter .25s;}

.pv-src img[src*="pv_cube"]{height:30px;}
.pv-plus{width:42px;height:42px;border-radius:50%;background:#1987FC;color:#fff;font-family:var(--font-hi);font-weight:800;font-size:36px;

.pv-src.pulse{animation:pvBtnPulse 1.15s cubic-bezier(.34,.62,.3,1) infinite;}
@keyframes pvBtnPulse{0%,100%{scale:1;}30%{scale:1.1;}58%{scale:.985;}}
.pv-make{height:62px;padding:0 28px;box-sizing:border-box;transform:translateX(-50%);border:3px solid #fff;border-radius:9999px;background:#FCB717;
  color:#0B3D8C;font-family:var(--font-hi);font-weight:800;font-size:28px;line-height:1;white-space:nowrap;cursor:pointer;z-index:8;
  box-shadow:0 6px 6px rgba(0,0,0,.25),inset 4.54px 9.09px 12.12px rgba(255,255,255,.25),inset -4.54px -4.54px 13.63px rgba(116,60,0,.19);
  -webkit-tap-highlight-color:transparent;transition:background .25s,color .25s,opacity .3s;}
.pv-make.pv-make-l{transform:none;}
.pv-make.off{background:#EDEDED;color:#B9B9B9;box-shadow:0 4px 0 #D6D6D6;}
.pv-make.pulse{animation:pvBtnPulse 1.15s cubic-bezier(.34,.62,.3,1) infinite;}
/* the dotted outlines are SVG (PVK.dashBox): one dot missing, travelling round */
.pv-dash{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
.pv-dash rect{fill:none;}
.pv-ring{box-sizing:border-box;border-radius:14px;background:rgba(255,170,40,.10);pointer-events:none !important;z-index:4;}

/* the answer cards (MTG2A04's .mq-opt - its rules came with its measuring screens, kept here for these) */
.mq-opts{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:30px;z-index:20;opacity:0;pointer-events:none;transition:top .5s ease,opacity .3s;}

/* review 2026-10-14 "make the calculator look better": a white panel, rounded-square keys with the game's raised edge,

.pv-pad{display:grid;grid-template-columns:repeat(3,58px);gap:10px;padding:14px;border-radius:24px;background:#fff;border:3px solid #CFE3F7;

  .pv-pop,.pv-blk.pulse,.pv-blk.hl,.pv-src.pulse,.pv-make.pulse,.pv-new,.pv-ring:not(.pv-hide),.pv-target,.pv-q.pulse,.pv-slot.on,.pv-key.pv-ok.pulse,.pv-th.hl,.mq-opts.in .mq-opt{animation:none;opacity:1;scale:1;}
}

/* ==================== [landing pv] the first screen's picture: the two children finish a build together (pv_landing.js) ==================== */
.sg-content.has-hero{max-width:1000px;}
.sg-content .sg-title{top:-14px;}
#sgHero{margin-top:0;}
/* one stage in .sgp's own px (772 x 96): pv_landing.js places the children, the build and its gaps */
.sgp{position:relative;width:772px;height:96px;}
/* a child: .sgp-kid sits on their foot point; .sgp-move = the swoosh in (translate), .sgp-fw = hops (translate),
   .sgp-tilt = leans / the run's tilt and blur (rotate, filter) - one property per layer, so the moves never fight.
   The pose pictures and the held blocks live in .sgp-tilt, so the blocks stay in the hands through it all. */
.sgp-kid{position:absolute;width:0;height:0;z-index:40;}
.sgp-move{position:absolute;left:0;bottom:0;width:0;height:0;opacity:0;}
.sgp-fw,.sgp-tilt{position:absolute;left:0;bottom:0;width:0;height:0;}
.sgp-fw{transform-origin:0 0;}
.sg-art .sgp-pose{position:absolute;bottom:0;left:0;translate:-50% 0;width:auto;height:224px;max-width:none;max-height:none;opacity:0;
  transform-origin:50% 100%;}   /* no drop shadow (user 2026-10-16 "look like they are in the air"): a soft one under the figure lifts it off the floor like a sticker - the floor shadows below ground them */
.sg-art .sgp-pose.sgp-round{height:118px;}
.sg-art .sgp-pose.on{opacity:1;}
/* (no idle breathing once in: user 2026-10-15 - the children stand still after the intro) */
@keyframes sgpBreathe{0%,100%{scale:1 1;}50%{scale:1.006 1.016;}}
.sgp-held{position:absolute;z-index:3;transform-origin:50% 50%;}
/* speed lines behind a child as they zip in */
.sgp-lines{position:absolute;bottom:40px;width:120px;height:150px;opacity:0;pointer-events:none;}
.sgp-l .sgp-lines{right:30px;transform-origin:100% 50%;}
.sgp-r .sgp-lines{left:30px;transform-origin:0 50%;}
.sgp-lines b{position:absolute;height:4px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));}
.sgp-r .sgp-lines b{background:linear-gradient(270deg,transparent,rgba(255,255,255,.95));}
.sgp-lines b:nth-child(1){top:18px;width:100%;}
.sgp-lines b:nth-child(2){top:70px;width:76%;}
.sgp-lines b:nth-child(3){top:122px;width:88%;}
.sgp-l .sgp-lines b{right:0;}
.sgp-r .sgp-lines b{left:0;}
.sgp-dust{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;z-index:45;
  background:radial-gradient(circle,rgba(236,214,178,.95),rgba(214,186,146,.6) 60%,transparent 72%);}
/* the build: the standing pieces pop in when the picture starts; the brought ones wait (pale outlines) */
.sgp-pc,.sgp-ghost{position:absolute;transform-origin:50% 100%;}
.sgp-pc{opacity:0;}
/* the half-built build stands there from the first frame (user 2026-10-15) - only the children come in */
.sgp-pc.sgp-stand{opacity:1;}
.sgp-pc.on{opacity:1;}
@keyframes sgpUp{0%{opacity:0;scale:.5;}100%{opacity:1;scale:1;}}
/* no placeholders where the brought cubes go (user 2026-10-15: the white shapes read as empty space): the build just
   stands unfinished until the children put their cubes on */
.sgp-ghost{display:none !important;}
.sgp.go .sgp-ghost.gone{animation:none;opacity:0;transition:opacity .2s;}
@keyframes sgpGhost{0%{opacity:.28;}100%{opacity:.62;}}
.sgp-pc > svg,.sgp-ghost > svg,.sgp-held > svg{display:block;overflow:visible;filter:drop-shadow(0 2px 2px rgba(12,46,92,.28));}
/* the user's house pieces (make_house.py): the drawing itself, no shadow of their own (it would line the seams) */
.sg-art .sgp-im{display:block;width:100%;height:100%;max-width:none;max-height:none;}
.sg-art .sgp-tb{display:block;width:100%;height:100%;max-width:none;max-height:none;filter:drop-shadow(0 1px 1.5px rgba(12,46,92,.32));}
/* toy-block colours: the lesson's own glossy cube (assets/pv_cube4.webp, golden), re-tinted */
.sg-art .sgp-tb.c-r{filter:hue-rotate(-32deg) saturate(1.15) drop-shadow(0 1px 1.5px rgba(12,46,92,.32));}
.sg-art .sgp-tb.c-y{filter:hue-rotate(14deg) brightness(1.06) drop-shadow(0 1px 1.5px rgba(12,46,92,.32));}
.sg-art .sgp-tb.c-g{filter:hue-rotate(68deg) saturate(.9) drop-shadow(0 1px 1.5px rgba(12,46,92,.32));}
.sg-art .sgp-tb.c-b{filter:hue-rotate(172deg) saturate(.95) drop-shadow(0 1px 1.5px rgba(12,46,92,.32));}
.sg-art .sgp-tb.c-p{filter:hue-rotate(230deg) saturate(.85) drop-shadow(0 1px 1.5px rgba(12,46,92,.32));}
/* the flag (castle): a pennant waving from the pole */
.sgp-pennant{position:absolute;left:3px;top:2px;width:24px;height:15px;background:linear-gradient(180deg,#FFD84A,#FFB21E);
  clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:0 50%;}
.sgp.built .sgp-pennant{animation:sgpFlag 1.1s ease-in-out infinite alternate;}
@keyframes sgpFlag{0%{transform:scale(1,1) skewY(4deg);}100%{transform:scale(.86,1.06) skewY(-6deg);}}
/* the chimney's smoke (house): three puffs rising, once the house stands */
.sgp-smoke{position:absolute;left:3px;bottom:100%;width:12px;height:12px;pointer-events:none;}
.sgp-smoke b{position:absolute;left:0;bottom:0;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.92);
  box-shadow:0 0 0 1px rgba(160,170,190,.35);opacity:0;}
.sgp.built .sgp-smoke b{animation:sgpSmoke 2.7s ease-out infinite;}
.sgp.built .sgp-smoke b:nth-child(2){animation-delay:.9s;}
.sgp.built .sgp-smoke b:nth-child(3){animation-delay:1.8s;}
@keyframes sgpSmoke{0%{opacity:0;translate:0 0;scale:.4;}15%{opacity:.95;}100%{opacity:0;translate:14px -40px;scale:1.7;}}
/* sparkles: on each block put in, a burst when the build is done, a twinkle now and then while the screen waits */
.sgp-spk{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;z-index:60;
  background:#FFE066;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 3px rgba(255,214,90,.9));}
.sgp-spk.big{width:22px;height:22px;margin:-11px 0 0 -11px;}
.sgp-spk.conf{width:10px;height:10px;margin:-5px 0 0 -5px;}
.sgp-spk.c1{background:#FF7A6B;}
.sgp-spk.c2{background:#6BC7FF;}
.sgp-spk.c3{background:#8EE06B;}
/* ground shadows by the scene's light (user 2026-10-15 "correct the shadows as per physics"): the sun is beyond the
   veranda at the back, a little right, so each shadow falls toward the viewer and to the left. Two parts each:
   - the CAST shadow: the thing's own silhouette laid on the floor - flipped about its foot line, foreshortened to
     .32, sheared left, black, blurred, see-through (the children's: their pose pictures; the build's: its pieces);
   - the CONTACT shadow: a small dark, tight ellipse where it touches the floor. */
.sgp-cast,.sgp-bcast{position:absolute;pointer-events:none;opacity:.2;filter:brightness(0) blur(7px);}   /* (user 2026-10-16 "too much shadow": .4 -> .2) */   /* soft: the shape and the fall, no details (user 2026-10-15) */
/* short and only a little sheared (user 2026-10-16 "still look like they are in the air"): a long, far-sheared cast put its
   dark mass (the body's) well away from the feet, so it read as a shadow under something hanging above the floor */
.sgp-cast{left:0;bottom:0;width:0;height:0;transform-origin:0 0;transform:skewX(-40deg) scaleY(-.13);}
.sgp-bcast{inset:0;transform:skewX(-40deg) scaleY(-.13);}
/* darkest at the feet, fading toward the head's end - a shadow is joined to what casts it */
.sg-art .sgp-cast .sgp-pose{-webkit-mask-image:linear-gradient(to top,#000 0%,#000 18%,rgba(0,0,0,.45) 100%);mask-image:linear-gradient(to top,#000 0%,#000 18%,rgba(0,0,0,.45) 100%);}
.sg-art .sgp-cast .sgp-pose{animation:none !important;}
.sgp-pcs{position:absolute;opacity:0;}
.sgp-pcs.on,.sgp-pcs.sgp-stand{opacity:1;transition:opacity .25s;}
.sgp-pcs .sgp-smoke,.sgp-pcs .sgp-pennant{display:none;}
/* the contact shadow (user 2026-10-15 "they look like they are in the air"): its dark core ON the soles' line - the upper
   half hides behind the feet, the lower shows as a dark band right under the toes, fading out round them */
.sgp-shd{position:absolute;bottom:-11px;height:22px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(36,16,2,.5),rgba(36,16,2,.32) 45%,rgba(36,16,2,.12) 78%,transparent);}   /* lighter (user 2026-10-16), still under the soles */
.sgp-bshd{position:absolute;height:14px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(40,18,2,.45),rgba(40,18,2,.25) 60%,transparent);}
.sgp-bshd{opacity:1;}
/* reduced motion: the finished build, the children standing by it */
.sgp.still .sgp-move,.sgp.still .sgp-pc,.sgp.still .sgp-pcs{opacity:1;animation:none;}
.sgp.still .sgp-held,.sgp.still .sgp-ghost{display:none;}
@media (prefers-reduced-motion:reduce){ .sgp .sgp-move,.sgp .sgp-pc{opacity:1;animation:none !important;}
  .sgp .sgp-held,.sgp .sgp-ghost,.sgp .sgp-lines{display:none;} .sgp-bshd{opacity:1;} }
/* the title on the wall (card landing_hero.title_look "wall"): terracotta brush paint on a gentle arc, edged in white
   (user 2026-10-16 "a little up, a little circular, white outline" - so no longer multiplied into the wall), then S02's
   two rings: white, and a darker one dropped below it (.sgw-b) - deep brown, the paint's own dark, not S02's blue: blue read
   as a cold sticker on S01's all-warm courtyard (user 2026-10-16 "is the blue matching?") */
.sg-content .sg-title.sg-wall{top:-34px;color:transparent !important;text-shadow:none !important;line-height:0;}
.sg-title.sg-wall .sgw-arc{display:block;margin:0 auto;overflow:visible;filter:drop-shadow(0 3px 4px rgba(90,30,8,.28));}
.sg-title.sg-wall .sgw-t{fill:url(#sgPaint);stroke:#fff;stroke-width:9px;stroke-linejoin:round;paint-order:stroke fill;letter-spacing:1px;}
.sg-title.sg-wall .sgw-b{fill:#5E2410;stroke:#5E2410;stroke-width:9px;stroke-linejoin:round;letter-spacing:1px;}
.sg-title.sg-wall .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
/* review 2026-10-14: "all the buttons' pop up effect should be an exact replication of the front screen play button" -
   every button arrives with the play button's pop (sgPlayPop: 1 -> 1.2 -> .93 -> 1.05 -> 1, .6s) - never the blocks'
   fade-in from .55 - and, once live, pulses with its idle pulse (sgPlayPulse, 1.15s) the moment the pop settles,
   as the play button does (app.js armStartPulse: +600ms). On `scale`, so it never fights a centring transform. */
@keyframes pvBtnPop{0%{scale:1;}35%{scale:1.2;}60%{scale:.93;}80%{scale:1.05;}100%{scale:1;}}
.pv-src.pv-pop,.pv-make.pv-pop{animation:pvBtnPop .6s cubic-bezier(.34,1.3,.5,1) both;}
.pv-src.pulse,.pv-make.pulse,
.nav-btn.active,.stage .nav-btn.active,
.end-btn.show{animation:pvBtnPop .6s cubic-bezier(.34,1.3,.5,1) both,pvBtnPulse 1.15s cubic-bezier(.34,.62,.3,1) .6s infinite;}
.nav-btn.active:active,.stage .nav-btn.active:active{animation:none;}
@media (prefers-reduced-motion:reduce){
  .pv-src.pv-pop,.pv-make.pv-pop,.pv-src.pulse,.pv-make.pulse,.nav-btn.active,.stage .nav-btn.active,.end-btn.show{animation:none;scale:1;}
}
/* review 2026-10-14: "the buttons pop up a lot on the left side and less on the right - they should pop from the centre".
   These are centred with transform:translateX(-50%), and the individual `scale` (the pops, the pulse) is applied about
   transform-origin in the element's UNshifted box - whose centre is the visible right edge, so they grew leftwards.
   Origin at the unshifted box's left edge = the visible centre. (The play button carries its translate inside its
   keyframes, so it never had this.) */
.pv-src,.pv-make,.pv-num,.pv-sym,.pv-person,.nav-btn,.stage .nav-btn,.stage.tut .nav-btn{transform-origin:0 50%;}
.pv-make.pv-make-l{transform-origin:50% 50%;}
.pv-dig{transform-origin:0 0;}
.pv-eq{transform-origin:0 0;}
/* review 2026-10-14: "when the sticks pop out they go out of the table" - a rod nearly fills its column's height
   (10-12px to spare above and below), so the cubes' springy pop (.55 -> ~1.15) and their 1.1 pulse / 1.08 highlight
   pushed it past the table's edges. A rod gets the same effects, sized to fit: at most 1.04 (~6px each way). */
@keyframes pvRodPop{0%{opacity:0;scale:.82;}70%{opacity:1;scale:1.04;}100%{opacity:1;scale:1;}}
.pv-rod.pv-pop{animation:pvRodPop .42s cubic-bezier(.3,.9,.4,1) both;}
@keyframes pvRodPulse{0%,100%{scale:1;filter:brightness(1) drop-shadow(0 2px 2px rgba(12,46,92,.28));}
  50%{scale:1.04;filter:brightness(1.22) saturate(1.06) drop-shadow(0 2px 2px rgba(12,46,92,.28));}}
.pv-rod.pulse{animation:pvRodPulse 1.1s ease-in-out infinite;}
/* a rod's highlight: the SAME inner light as the cubes (.pv-blk.hl's #pvInGlow - user 2026-10-16 "the light should not be
   different on the yellow and the green cubes"; it was a 1.3 brightness flash here), only its grow kept small */
@keyframes pvRodHl{0%,100%{scale:1;}50%{scale:1.04;}}
.pv-rod.hl{animation:pvRodHl 1.1s ease-in-out 2;}
.pv-rod.lift{scale:1.04;}
@media (prefers-reduced-motion:reduce){ .pv-rod.pv-pop,.pv-rod.pulse,.pv-rod.hl{animation:none;opacity:1;scale:1;} }
/* review 2026-10-14: "when the correct option goes up, remove the other 2 options completely" - .mq-opt.faded's
   !important opacity (.45) outranked .pv-gone's, so the gone cards stayed half there */
.mq-opt.pv-gone,.mq-opts.in .mq-opt.pv-gone{opacity:0 !important;visibility:hidden;pointer-events:none !important;
  transition:opacity .35s ease-out,visibility 0s linear .35s !important;}
/* review 2026-10-14: the number pad's answer is ONE box with a blinking typing cursor "|"; the pad is two rows beside it */
.pv-slot.pv-slot-one{gap:2px;padding:0 12px;border-style:solid;}
.pv-slot-one .pv-ch{display:inline-block;}
.pv-caret{display:inline-block;font-weight:400;color:#1987FC;margin-left:2px;animation:pvCaret 1s steps(1) infinite;}
@keyframes pvCaret{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.pv-pad.pv-pad-2{grid-template-columns:repeat(6,58px);}
@media (prefers-reduced-motion:reduce){ .pv-caret{animation:none;} }
/* the landing's play button is never seen grey (user 2026-10-15 "a small time when the disabled button is also shown"):
   while it waits it is not there at all; it arrives gold, with its pop (a tap anywhere still starts a blocked greeting) */
.sg-btn.sg-waiting{opacity:0 !important;pointer-events:none;}
/* the number pad in the screen's own family (user 2026-10-15 review): keys like the number cards - white to light blue,
   a soft blue base, navy numerals; backspace a quiet grey-blue; the tick in the game's gold, like the next button (green
   and orange mean tens and ones here, so the pad does not use them). A pressed key sinks onto its base. */
.pv-pad{background:#FFFFFF;border:3px solid #CFE3F7;border-radius:26px;box-shadow:0 6px 0 #CFE3F7,0 14px 26px rgba(12,46,92,.10);}
.pv-key{border-radius:18px;background:linear-gradient(#FFFFFF,#E4F1FE);border:2px solid #A9CDF2;color:#012F76;
  box-shadow:0 5px 0 #8DB8E8,0 7px 10px rgba(12,46,92,.10);transition:translate .08s,box-shadow .08s;}
.pv-key:active{translate:0 4px;box-shadow:0 1px 0 #8DB8E8;}
.pv-key.pv-back{background:linear-gradient(#F7FAFE,#E3EAF3);border-color:#B9C8DA;color:#4F6B8F;box-shadow:0 5px 0 #A3B4C9,0 7px 10px rgba(12,46,92,.10);}
.pv-key.pv-back:active{box-shadow:0 1px 0 #A3B4C9;}
.pv-key.pv-ok{background:linear-gradient(#FFD45A,#FCB717);border-color:#E9A100;color:#012F76;box-shadow:0 5px 0 #D18F00,0 7px 10px rgba(12,46,92,.14);}
.pv-key.pv-ok:active{box-shadow:0 1px 0 #D18F00;}
.pv-key.pv-ok.off{opacity:1;}
.pv-key.hint-on{border:3px solid #1987FC;box-shadow:0 5px 0 #8DB8E8,0 0 0 6px rgba(25,135,252,.28);}
.pv-key.pv-ok.hint-on{box-shadow:0 5px 0 #D18F00,0 0 0 6px rgba(25,135,252,.28);}
/* the "?" being typed into: solid blue while open, the cursor blinking in it; wrong: a red flash */
.pv-q.pv-typein.open:not(.filled){border-style:solid;border-color:#1987FC;color:#012F76;background:#fff;}
.pv-q.pv-typein .pv-ch{color:#012F76;}
.pv-q.pv-typein.open.wrong{border-color:#1987FC;background:#fff;}   /* never red (QA checklist): a wrong answer only shakes */

  background:linear-gradient(#2A5BAE,#0B3D8C);box-shadow:0 5px 0 #052463,0 8px 12px rgba(12,46,92,.2);
  text-shadow:0 2px 0 rgba(0,0,0,.25);font-size:32px;}   /* the numbers' own dark blue (user 2026-10-15) */

  background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none;}

.pv-pad .pv-key svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));}

.pv-pad .pv-key.pv-ok.hint-on{box-shadow:0 5px 0 #D18F00,0 0 0 4px #fff,0 0 0 8px rgba(25,135,252,.6) !important;}

.pv-pad .pv-key{width:62px;height:62px;border-radius:17px;}

/* the practice screens' equation sits 12px higher (user 2026-10-15), a little above the slide box's top edge: let it show
   there (the box still clips sideways, for the slide-in) */

<script>/* swiftpal-bridge.js */
/* SWIFTPAL PLATFORM BRIDGE - routes every xAPI statement to the host: Android JavascriptInterface,
   iOS WKWebView (webkit.messageHandlers.swiftpal), or web/electron postMessage.
   Verbatim from the HI01H01_L02_S04 reference build (where it is inlined, that book being a single
   file). Loaded BEFORE app.js. Guarded with `||` so a host that injects its own window.SwiftPAL
   first always wins. The game's own internal signal bus is window.GameBus, never this name. */
window.SwiftPAL = window.SwiftPAL || (function(){
  const _platform = (window.Android && typeof window.Android.sendEvent === "function") ? "android"
    : (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.swiftpal) ? "ios"
    : (window.parent !== window) ? "web"
    : (window.opener) ? "electron" : "web";
  function _call(name, args){
    try{
      if(_platform === "android"){
        if(window.Android && typeof window.Android[name] === "function") window.Android[name](...args);
        else console.warn("[SwiftPAL Bridge] Android." + name + " not found");
      } else if(_platform === "ios"){
        window.webkit.messageHandlers.swiftpal.postMessage({ fn: name, args });
      } else {
        const target = (window.parent !== window) ? window.parent : (window.opener || null);
        if(target) target.postMessage({ source: "swiftpal", fn: name, args }, "*");
      }
    }catch(e){ console.warn("[SwiftPAL Bridge] _call error for " + name + ":", e); }
    try{ window.dispatchEvent(new CustomEvent("swiftpal:" + name, { detail: { fn: name, args } })); }catch(e){}
    try{ console.log("[SwiftPAL Bridge] " + _platform + "." + name, ...args); }catch(e){}
  }
  return {
    _platform: _platform,
    sendEvent(statement){ _call("sendEvent", [JSON.stringify(statement)]); }
  };
})();

     backdrop, mirrored at the stage's edge (bleed below): the room, the yard, the fridge door simply carry on.
   - a phone or tablet held upright: a "turn it" card over the lesson (html.ask-rotate); a voice line that was
     speaking waits for the turn back, then goes on.
   - a phone/tablet BROWSER goes full screen on the play tap, and stays landscape where it can (Android).
   Pointer maths everywhere reads --scale at the moment it runs, so drags stay exact at every size. */
const Screen = (function(){
  const root = document.documentElement;
  let probe = null, asking = false, heldVO = false, bleedQueued = false;
  function safe(){
    if(!probe){ probe = document.createElement("div"); probe.setAttribute("aria-hidden", "true");
      probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
        "padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)";
      (document.body || root).appendChild(probe); }
    const cs = getComputedStyle(probe);
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  }
  function touch(){ try{ return matchMedia("(pointer: coarse)").matches; }catch(e){ return false; } }
  function fit(){
    const vw = (window.visualViewport ? window.visualViewport.width  : root.clientWidth)  || window.innerWidth;
    const vh = (window.visualViewport ? window.visualViewport.height : root.clientHeight) || window.innerHeight;
    const sa = safe(), aw = Math.max(1, vw - sa.l - sa.r), ah = Math.max(1, vh - sa.t - sa.b);
    // contain-fit, scaling UP to fill the screen (no 1x cap, no margin) so a 16:9 viewport is covered edge-to-edge
    const s = Math.min(aw / 1333, ah / 750);
    root.style.setProperty("--scale", s);
    root.style.setProperty("--safe-dx", (sa.l - sa.r) / 2 + "px");   // centred in the safe area, not the whole screen
    root.style.setProperty("--safe-dy", (sa.t - sa.b) / 2 + "px");
    root.classList.toggle("bands-x", vw - 1333 * s > 1);              // (QA hooks: which bands the bleed fills)
    root.classList.toggle("bands-y", vh - 750 * s > 1);
    rotate(touch() && vh > vw * 1.1);
  }
  function rotate(on){
    if(on === asking) return;
    asking = on; root.classList.toggle("ask-rotate", on);
    try{                                                              // (voEl: the one VO element, below - not there yet on the first fit)
      if(on && !voEl.paused && !voEl.ended){ voEl.pause(); heldVO = true; }
      else if(!on && heldVO){ heldVO = false; voEl.play().catch(()=>{}); }
    }catch(e){}
  }
  /* a phone/tablet browser: full screen, landscape-locked where the browser can (Android Chrome). Called from a tap.
     Never on a desktop, inside an embedding page, or in a host app's WebView - those run the screen themselves. */
  function fullscreen(){
    try{
      const bridge = window.SwiftPAL && window.SwiftPAL._platform;
      if(!touch() || window.self !== window.top || (bridge && bridge !== "web") || /; wv\)/.test(navigator.userAgent)) return;
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      if(!req || document.fullscreenElement || document.webkitFullscreenElement) return;
      const lock = ()=>{ try{ screen.orientation.lock("landscape").catch(()=>{}); }catch(e){} };
      const p = req.call(root, { navigationUI: "hide" });
      if(p && p.then) p.then(lock, ()=>{}); else lock();
    }catch(e){}
  }
  /* the bands: 8 mirrored copies of the stage's own backdrop around it (index.html #stageBleed), kept in step with every
     change of it - a slide's data-bg and --horizon, the tutorial's white, the landing's and the end's transparency.
     While a hint card dims the stage, they dim with it (.dim). */
  function bleed(){
    bleedQueued = false;
    const st = document.getElementById("stage"), b = document.getElementById("stageBleed");
    if(!st || !b) return;
    /* (review 2026-10-07 "fix these line cuts": at a fractional --scale the stage's background COLOUR was painted to its
       very edge but its picture stopped short of the last device column, so the colour - the floor's, under every room
       picture - showed as a 1px line down the stage's right side. The colour now lies on an underlay 1px inside the
       stage (.stage-wrap.bg-under::before, --stage-bg) and the stage's own is transparent: the edge column is picture
       + band only. The wrap is not observed, so toggling its class to read the slide's colour starts no loop.) */
    const wrap = st.parentElement; wrap.classList.remove("bg-under");
    const cs = getComputedStyle(st), color = cs.backgroundColor;
    const css = "background-color:" + color + ";background-image:" + cs.backgroundImage + ";background-size:" + cs.backgroundSize +
                ";background-position:" + cs.backgroundPosition + ";background-repeat:" + cs.backgroundRepeat;
    wrap.style.setProperty("--stage-bg", color); wrap.classList.add("bg-under");
    if(b._css === css) return;
    b._css = css; b.dataset.bg = st.dataset.bg || "";
    for(const i of b.children) i.style.cssText = css;
  }
  function queueBleed(){ if(!bleedQueued){ bleedQueued = true; requestAnimationFrame(bleed); } }
  function watch(){
    const st = document.getElementById("stage");
    if(!st || !window.MutationObserver) return;
    const mo = new MutationObserver(queueBleed);
    mo.observe(st, { attributes: true, attributeFilter: ["class", "style", "data-bg"] });
    mo.observe(document.body, { attributes: true, attributeFilter: ["class"] });
    const ra = document.getElementById("rotateAsk"); if(ra) ra.addEventListener("click", fullscreen);   // Android: the tap itself turns the screen
    queueBleed();
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit(); watch();
  return { fit: fit, fullscreen: fullscreen, bleed: queueBleed };
})();

/* ---------- 2. SIGNAL BUS + OFFLINE TELEMETRY ---------- */
/* TELEMETRY: offline self-capture. Every signal is buffered to localStorage so
   the run survives a reload / works with NO host app. A full results record can
   be pulled via GameBus.downloadResults() (or the ?dev=1 button on the end
   screen). If `endpoint` is set AND the device is online, the final record is
   also POSTed — left null so the lesson is fully offline by default. */
const TELEMETRY = {
  endpoint: null,   // e.g. "https://lrs.example.com/swiftpal" — null = offline only
  storageKey: "swiftpal:run:" + CARD.skill_code + "_" + (CARD.part_label || "P1")
};
/* ===== QA CHECKLIST [14]: xAPI VERB LAYER =================================
   The engine emits 36 GameBus signals but none of the seven required xAPI
   verbs. This layer maps the ones that already have a signal and fires the
   rest explicitly. context echoes context_id / journey_id / medium straight
   off the launch URL and always carries skill_code. */
const XAPI = window.XAPI = (function(){
  var q; try{ q = new URLSearchParams(location.search); }catch(e){ q = { get:function(){ return null; } }; }
  var startedAt = Date.now();
  var ctx = { skill_code: CARD.skill_code, lo_code: CARD.lo_code,
              context_id: q.get("context_id"), journey_id: q.get("journey_id"),
              medium: q.get("medium") || CARD.medium || "hi" };
  /* [QA 14] question_format per answerable slide type (HI01's enum). */
  var QUESTION_FORMAT = { PV_MERGE_MCQ:"mcq", MENTAL_MCQ:"mcq", PV_NUMPAD:"numeric_input" };
  var log = [], fired = {};
  /* send(verb, object, result): builds the standard { verb, object, result, context } statement
     (HI01 shape) and hands it to the platform bridge - SwiftPAL.sendEvent -> Android / iOS / web.
     Falls back to a direct postMessage only if the bridge is absent (standalone dev).
     context echoes context_id / journey_id / medium off the launch URL, always carries skill_code,
     and on a slide-level verb adds question_id / question_index / template / question_format / phase. */
  function send(verb, object, result){
    var o = object || {}, sl = null;
    try{ if(o.slide_id) sl = CARD.slides.find(function(x){ return x.id === o.slide_id; }) || null; }catch(e){}
    var c = Object.assign({}, ctx, { session_ms: Date.now() - startedAt });
    if(sl){ Object.assign(c, { question_id: sl.id, question_index: CARD.slides.indexOf(sl), template: sl.type,
                               question_format: QUESTION_FORMAT[sl.type] || null, phase: sl.phase }); }
    var statement = { verb: verb, object: o, result: result || {}, context: c };
    log.push(Object.assign({ ts: Date.now() }, statement));
    try{
      if(window.SwiftPAL && typeof window.SwiftPAL.sendEvent === "function") window.SwiftPAL.sendEvent(statement);
      else window.parent && window.parent.postMessage({ type:"swiftpal:xapi", statement: statement }, "*");
    }catch(e){}
    try{ console.log("[xapi]", verb, statement); }catch(e){}
    return statement;
  }
  return { ctx:ctx, log:log, send:send,
           once:function(v,o,r){ if(fired[v]) return null; fired[v]=1; return send(v,o,r); },
           hasFired:function(v){ return !!fired[v]; } };
})();
/* signal -> verb, for the three that already have a 1:1 signal */
const XAPI_MAP = { slide_entered:"screen_viewed", hint_shown:"hint_used", audio_replay:"audio_replayed" };
const XAPI_ANSWERABLE = ["PV_MERGE_MCQ","PV_NUMPAD","MENTAL_MCQ"];   /* slide types that send question_started */

/* [QA 01] The game's internal bus is GameBus (window.GameBus). The global SwiftPAL name belongs to
   the platform bridge (swiftpal-bridge.js, loaded first), which XAPI.send() hands each statement to.
   This bus used to be called SwiftPAL itself, which took the name the host bridge needs. */
const GameBus = window.GameBus = {
  signals: [],
  validatorReport: { missing_signals: [], errors: [], passed: false },
  firedSet: new Set(),
  startedAt: Date.now(),
  emit(name, payload){
    const evt = Object.assign({
      ts: Date.now(),
      skill_code: CARD.skill_code,
      lo_code: CARD.lo_code,
      signal: name
    }, payload || {});
    this.signals.push(evt);
    this.firedSet.add(name);
    /* [14] fan the mapped signals out as xAPI verbs */
    /* a MANUAL hint_shown is a bulb tap, whose hint_used the capture listener on #hintBtn already
       sent - mapping it too would log the verb twice ([QA 14] no duplicated verbs). */
    /* [QA 14] one verb per screen, as HI01 does: an answerable slide sends question_started
       (mountSlide), everything else screen_viewed - never both for the same slide. */
    try{ if(XAPI_MAP[name] && !(name === "hint_shown" && payload && payload.manual)
            && !(name === "slide_entered" && payload && XAPI_ANSWERABLE.indexOf(payload.type) >= 0))
           XAPI.send(XAPI_MAP[name], { slide_id: payload && payload.slide_id }, payload || {}); }catch(e){}
    try{ console.log("[signal]", name, evt); }catch(e){}
    /* [QA 14] NOISE CONTROL (as HI01): the raw signal firehose is DEV-ONLY. Production hosts receive
       only the 7 xAPI verbs through the bridge. */
    if(new URLSearchParams(location.search).has("dev")){
      try{ window.parent?.postMessage({type:"swiftpal:signal", payload: evt}, "*"); }catch(e){}
    }
    this.persist();
  },
  /* full results record (used for download / POST / end-of-lesson dump) */
  exportResults(){
    const ms = (typeof state!=="undefined") ? state.masteryAttempts : 0;
    const mh = (typeof state!=="undefined") ? state.masteryHits : 0;
    return {
      skill_code: CARD.skill_code, lo_code: CARD.lo_code, part: CARD.part_label || null,
      started_at: this.startedAt, exported_at: Date.now(),
      mastery: { hits: mh, attempts: ms, score: ms ? mh/ms : 0 },
      validatorReport: this.validatorReport,
      signals: this.signals
    };
  },
  /* silent: flush the running buffer to localStorage (survives reload / offline) */
  persist(){
    try{ localStorage.setItem(TELEMETRY.storageKey, JSON.stringify(this.exportResults())); }
    catch(e){ /* private mode / quota — non-fatal, postMessage + memory still work */ }
  },
  /* pull the run as a JSON file (teacher/dev; not in the child's flow) */
  downloadResults(){
    try{
      const blob = new Blob([JSON.stringify(this.exportResults(), null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = CARD.skill_code + "_" + (CARD.part_label||"P1") + "_results.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 1000);
    }catch(e){ console.error("[telemetry] download failed", e); }
  }
};

/* ---------- 3. AUDIO ---------- */
let isPlaying=false, currentAudio=null;
function setPlaying(on){
  // the dynamic Swiftie sits header-left; the audio chips pulse to signal playback. r4/F1: share the
  // .playing toggle across the header chip AND the tut-card replay chip (the header is hidden in the
  // tut frame, so the in-card .tut-audio is the only visible affordance and must react to VO too).
  isPlaying=on;
  bgmDuck();
  /* [QA 05] only the chip the audio is actually coming FROM animates, and only one at a time.
     It used to pulse every chip for every sound - option words, feedback, the count-aloud. */
  const src = on && currentAudio ? srcOf(currentAudio) : null;
  const from = on ? chipFor(src) : null;
  document.querySelectorAll(".audio-chip, .tut-audio, .sg-vo").forEach(c => c.classList.toggle("playing", c === from));
  swApplyPose();   // freeze/unfreeze Swiftie's mouth: animate only while a clip is sounding
}
/* [QA 15] ONE reusable VO element, not a new Audio() per clip. Every clip used to get its own
   element and none was ever released: ~150 live media players by the last question, and the
   renderer crashed there on every full playthrough (Android WebViews cap players far lower).
   _playTok retires a superseded clip's callbacks, so a stopped clip can never fire onEnd late. */
const voEl = new Audio(); voEl.preload = "auto";
let _playTok = 0;
/* chipFor(src): the ONE chip a clip belongs to, or null. The landing greeting belongs to the
   landing chip; a slide's own lines (prompt / ask / conclude ...) to that slide's chip - the in-card
   tutorial chip when the tutorial frame is up, else the header chip. Feedback, option words and
   the count-aloud belong to no chip, so no chip moves for them. */
const _FEEDBACK_KEYS = { correct:1, try_again:1, hint:1, hint1:1, reveal:1, sfx:1 };
function chipFor(src){
  if(!src || typeof CARD === "undefined") return null;
  const gate = document.getElementById("startGate");
  if(gate && !gate.classList.contains("hidden")){
    const land = (CARD.assets && CARD.assets.audio && CARD.assets.audio.vo_landing) || "";
    return land && src.indexOf(land) >= 0 ? document.getElementById("sgVo") : null;
  }
  const sl = CARD.slides[state.idx];
  if(!sl || !sl.audio) return null;
  const own = Object.keys(sl.audio).some(k => !_FEEDBACK_KEYS[k] && src === audioFor(sl, k));
  if(!own) return null;
  return document.querySelector("#slideHost .tut-audio") || document.getElementById("audioChip");
}
/* [QA 11] replay-chip guard (HI01 [24a N8]): a replay tap while a clip is sounding is ignored.
   play() stops the current clip, and a paused clip never fires its end callback - so a replay
   mid-count froze DEMO_COUNT (आगे never unlocked) and mid-answer-word lost the auto-advance.
   The tap still reports audio_replayed (flagged ignored), so every tap is logged. */
function replayTap(slide, src){
  state.audioReplays++;
  const busy = isPlaying;
  GameBus.emit("audio_replay", { slide_id: slide ? slide.id : "landing", phase: slide ? slide.phase : "landing",
    count: state.audioReplays, src: src, ignored_while_playing: busy });
  return !busy;
}
function stopAudio(){
  _playTok++;
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio=null; }
  setPlaying(false);
}
/* play(src, onEnd): real clip if the path exists; silent beat if missing/blocked. */
function play(src, onEnd){
  stopAudio(); setPlaying(true);
  const tok = _playTok;
  let done=false; const fire=()=>{ if(done || tok !== _playTok) return; done=true; currentAudio=null; setPlaying(false); if(onEnd) onEnd(); };
  if(src){
    const a = voEl; currentAudio = a;
    let retried = false;
    a.onended = fire;
    /* the clip's blob: copy failed (Assets): the file's own URL, once; anything else - a silent beat, then on */
    a.onerror = ()=>{ if(tok !== _playTok) return;
      if(!retried && /^blob:/.test(a.src)){ retried = true; a.src = src; a.play().catch(()=>{ if(tok === _playTok) setTimeout(fire, 1200); }); return; }
      setTimeout(fire, 1200); };
    a.setAttribute("data-asset", src);
    a.src = Assets.url(src); setPlaying(true);   // re-apply now the src is known, so the right chip lights
    a.play().catch(()=>{ if(tok === _playTok) setTimeout(fire, 1200); });
    /* WATCHDOG: whatever waits on this clip's end (आगे, the next line, the play button) can never be stranded by a clip
       that stalls mid-way or never reports `ended`: the clip's remaining length + 3s grace, re-armed while it is still
       really moving on. No length yet (metadata stuck): 15s. */
    let lastT = -1;
    const watch = ()=>{ if(done || tok !== _playTok) return;
      const left = isFinite(a.duration) && a.duration > 0 ? (a.duration - a.currentTime) / (a.playbackRate || 1) : 12;
      setTimeout(()=>{ if(done || tok !== _playTok) return;
        if(!a.paused && !a.ended && a.currentTime > lastT + 0.05){ lastT = a.currentTime; watch(); } else fire(); }, Math.max(0, left) * 1000 + 3000);
    };
    watch();
  } else { setTimeout(fire, 800); }
}
/* playSfx(id): fire-and-forget sound effect that can overlap the spoken VO (does NOT touch
   currentAudio / the play() chain). Two pooled elements, reused - never one per call.
   Silently no-ops if the file is missing or playback is blocked. */
const _sfxPool = [new Audio(), new Audio(), new Audio(), new Audio()]; let _sfxNext = 0;
function playSfx(id, onEnd){
  if(!id) return;
  try{
    const a = _sfxPool[_sfxNext++ % _sfxPool.length];
    a.pause(); a.volume = 0.7; a.onended = onEnd ? ()=>{ a.onended = null; onEnd(); } : null;
    const f = "assets/voiceover/" + id + "." + AUDIO_EXT;
    a.onerror = ()=>{ a.onerror = null; if(/^blob:/.test(a.src)){ a.src = f; a.play().catch(()=>{}); } };   // blob: copy failed - the file, once
    a.setAttribute("data-asset", f); a.src = Assets.url(f);
    a.play().catch(()=>{});
  }catch(e){}
}
/* ---------- game-feel: procedural SFX (no audio files) + success particle burst ----------
   WebAudio resumes on the first user tap (autoplay policy), so taps/answers always sound. */
let _juiceAC = null;
function _ac(){ if(!_juiceAC){ try{ _juiceAC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(_juiceAC && _juiceAC.state === "suspended"){ try{ _juiceAC.resume(); }catch(e){} } return _juiceAC; }
function _tone(freqs, type, dur, vol){ const c = _ac(); if(!c) return; const t0 = c.currentTime;
  freqs.forEach((f, i)=>{ const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    const t = t0 + i*(dur/freqs.length); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur/freqs.length); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur/freqs.length); }); }
const sfxTap       = ()=> _tone([520], "sine", 0.09, 0.09);
/* ===== QA checklist 2026-10-05: the STANDARD SFX + background music, as files in assets/sfx/ =====
   sfx_correct / sfx_wrong (correct + incorrect feedback), sfx_confetti (with every confetti burst), sfx_play (the play
   button), sfx_nudge (a soft, encouraging chime with each nudge hand), bgm (the lesson's background track, from the play
   tap on) and bgm_game (the practice game's track - the lesson track carries on if it is not shipped). A file that
   is missing or blocked is silent; correct / wrong fall back to the old procedural tones so feedback is never mute. */
const SFX_DIR = "assets/sfx/";
function playSfxFile(name, vol, fallback){
  try{
    const a = _sfxPool[_sfxNext++ % _sfxPool.length];
    a.pause(); a.volume = vol == null ? 0.8 : vol;
    const f = SFX_DIR + name + "." + AUDIO_EXT;
    /* its blob: copy failed (Assets): the file's own URL, once; the file itself failed: the procedural fallback */
    a.onerror = ()=>{ if(/^blob:/.test(a.src)){ a.src = f; a.play().catch(()=>{}); return; } a.onerror = null; if(fallback) fallback(); };
    a.setAttribute("data-asset", f); a.src = Assets.url(f);
    a.play().catch(()=>{});
  }catch(e){ if(fallback) fallback(); }
}
const sfxCorrect   = ()=> playSfxFile("sfx_correct", 0.8, ()=> _tone([660, 880, 1180], "sine", 0.42, 0.13));
const sfxWrongSoft = ()=> playSfxFile("sfx_wrong", 0.6, ()=> _tone([300, 235], "triangle", 0.20, 0.08));   // gentle, never harsh
/* 2026-10-07: the team's Standard SFX pack (correct / incorrect / confetti / play / next). Its confetti is mastered
   ~8dB hotter than the kit's and lands on top of sfx_correct + the VO, so it plays lower to sit under them. */
const sfxConfetti  = ()=> playSfxFile("sfx_confetti", 0.45);
const sfxPlay      = ()=> playSfxFile("sfx_play", 0.9);
const sfxNext      = ()=> playSfxFile("sfx_next", 0.9);   // the आगे tap (a disabled आगे fires no click, so no sound)
const sfxNudge     = ()=> playSfxFile("sfx_nudge", 0.45);
/* background music: one looping element, started by the play tap (never before it), ducked under every VO clip,
   paused while the app is in the background. bgmFor(phase) picks the track: the practice game has its own. */
/* 2026-10-07: bgm.ogg is the team's "Standard Background Music 2" (bouncy, seamless 4-min loop; "1" is an 18s lo-fi loop
   that would repeat ~30x a lesson). Its quietness is BAKED INTO THE FILE (-33 LUFS, ~14.5dB under the VO's -18.5): iOS
   Safari ignores media .volume, so a loud file would play at full VO level there. VOL/DUCK only add the dip under VO
   (0.35 = -9dB, ~24dB under the voice); the dip is a short fade, not a jump, so the bed never pumps. */
var BGM = { el: null, track: "", VOL: 1, DUCK: 0.35, raf: 0 };   // (var: setPlaying, above, may reach it)
function bgmDuck(){
  if(!BGM || !BGM.el) return;
  const el = BGM.el, from = el.volume, to = isPlaying ? BGM.DUCK : BGM.VOL, ms = to < from ? 180 : 600, t0 = performance.now();
  cancelAnimationFrame(BGM.raf);
  const step = now =>{ if(BGM.el !== el) return; const k = Math.max(0, Math.min(1, (now - t0) / ms));   // (a frame's timestamp can be a little BEFORE t0: k < 0 set volume > 1 and threw - BGM duck clamp
    el.volume = from + (to - from) * k; if(k < 1) BGM.raf = requestAnimationFrame(step); };
  BGM.raf = requestAnimationFrame(step);
}
function bgmFor(phase){
  const want = phase === "practice" ? "bgm_game" : "bgm";
  if(!BGM.el || BGM.track === want) return;
  bgmPlay(want, ()=>{ if(want !== "bgm" && BGM.track !== "bgm") bgmPlay("bgm"); });          // no game track shipped: keep the lesson one
}
function bgmPlay(track, onMissing){
  /* only a track that ships (ASSET_SIZES = the files on disk): bgm.ogg / bgm_game.ogg are not in this lesson yet, and
     asking for them was a 404 on every play tap. Drop a file into assets/sfx/ and run tools/gen_asset_sizes.js. */
  if(!Object.prototype.hasOwnProperty.call(ASSET_SIZES, SFX_DIR + track + "." + AUDIO_EXT)){ if(onMissing) onMissing(); return; }
  try{
    const old = BGM.el; if(old){ old.pause(); old.onerror = null; }
    const a = new Audio(); a.loop = true; a.preload = "auto";
    a.onerror = ()=>{ a.onerror = null; if(BGM.el === a && onMissing) onMissing(); };
    a.src = Assets.url(SFX_DIR + track + "." + AUDIO_EXT);
    a.volume = isPlaying ? BGM.DUCK : BGM.VOL;   // start at the right level - a new track never fades in from 1
    BGM.el = a; BGM.track = track; bgmDuck();
    a.play().catch(()=>{});
  }catch(e){}
}
function bgmStart(){ if(!BGM.el) bgmPlay("bgm"); }

/* ===== FLN ANIMATION KIT: confetti (call site) BEGIN =====
   Recipe 7 REPLACES the correct-answer celebration rather than tuning it, so the

   passed through; in tutorial the tile-level confirm (recipe 19) is the feedback.
   The old function is kept, unreferenced, so the change is reversible in one line. */
function confettiCannon(){

     2026-09-30: "all square-shaped and not covering the full horizontal space". It falls over the WHOLE window
     (#fxLayer, body-level: the stage is letterboxed and clips at its edges), so ~100 pieces keep the density of the

     including tutorial. The palette is the kit's own VIBGYOR pairs. */
  /* fall: seconds to cross the window, before the depth divisor - the kit's [1.1, 1.8] made ~40% slower (review
     2026-09-30: "reduce its speed a bit"); pieces cross in ~1.4-3.5s, the burst clears in ~3.8s */
  FLNMotion.confetti.burst({
    host: "#fxLayer", phase: sl.phase, phases: [], count: 100, fall: [1.6, 2.6]

// pitch climbs one step per block — HEAR the count
/* slide audio path: per slide, we look at slide.audio.prompt / .phoneme / etc.
   In this v0.1 the embedded card holds short ids; the compiler would replace
   them with base64 data URIs. We resolve to assets/voiceover/{id}.mp3 with fallback. */
function audioFor(slide, key){
  if(!slide.audio || !slide.audio[key]) return null;
  return "assets/voiceover/" + slide.audio[key] + "." + AUDIO_EXT;
}
/* Play a SEQUENCE of audio sources back-to-back. Each one finishes (or
   falls back to silent beat if missing) before the next starts. */
function playChain(srcs, i, onDone){
  i = i || 0;
  if(i >= srcs.length){ if(onDone) onDone(); return; }
  play(srcs[i], () => playChain(srcs, i+1, onDone));
}
/* On slide mount, play prompt → phoneme/word_name → instruction in order.
   KG learners can't read prompt_hi — the chain gives them both the
   instruction AND the cue (letter sound or picture name) audibly.
   onDone fires after the whole chain finishes (used to gate the नav button). */
function autoPlayChain(slide, onDone){
  const order = ["prompt","phoneme","shape_name","word_name","instruction"];
  const chain = [];
  for(const k of order){
    const src = audioFor(slide, k);
    if(src) chain.push(src);
  }
  if(chain.length) playChain(chain, 0, onDone);
  else if(onDone) onDone();
}

/* nav button: enable/disable the kit-style pill. When it becomes active (the
   activity is done) but the child doesn't tap आगे, the hand-nudge points at it. */
function setNavActive(on){

  btn.disabled = !on;
  btn.classList.toggle("active", on);
  clearTimeout(state.navNudgeTimer);
  if(on) state.navNudgeTimer = setTimeout(nudgeNavBtn, 4500);
}
function nudgeNavBtn(){
  /* [04] QA CHECKLIST: "Nudge hand only ever points at interactive tiles/objects
     - never at आगे, शुरू करें, or any other button." This pointed it straight at
     #navBtn, so it is now a no-op. Kept as a function because setNavActive()
     schedules it and several modules clear its timer. */

  const sw = document.querySelector(".slide-stage").getBoundingClientRect();
  const scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--scale")) || 1;
  nh.style.left = ((r.left - sw.left)/scale + r.width/scale/2 - 48) + "px";
  nh.style.top  = ((r.top  - sw.top )/scale + r.height/scale/2 - 6) + "px";
